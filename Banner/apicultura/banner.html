<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="color-scheme" content="dark">

  <title>Banner Literatura Peruana</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <main class="banner" aria-label="Banner animado de literatura peruana">

    <!-- CAPA 1: FONDO GENERAL (Se mueve a la DERECHA) -->
    <div
      class="banner__background banner__background--far"
      aria-hidden="true">
    </div>

    <!-- CAPA 2: ESCRITORES (Se mueve a la IZQUIERDA) -->
    <div
      class="banner__background banner__background--near"
      aria-hidden="true">
    </div>

    <!-- LOGO ESTÁTICO CENTRAL -->
    <img
      class="banner__vehicle"
      src="img/logo.png"
      alt="Literatura Peruana"
      decoding="async"
      fetchpriority="high"
    >

  </main>

</body>
</html>
